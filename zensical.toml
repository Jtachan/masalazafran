[project]
site_name = "Masala & Azafran"
site_description = "International recipes from an indo-hispanic kitchen."
site_author = "Jtachan"
docs_dir = "recipes"

extra_javascript = [
    "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",
    "_js/tablesort.js",
]
extra_css = [
    "stylesheet.css"
]

nav = [
    { "Home" = "index.md" },
    { "Dough" = [
        "dough/index.md",
        "dough/corn_tortillas.md",
        "dough/focaccia.md",
        "dough/fresh_pasta.md",
        "dough/gnocchi.md",
        "dough/green_pasta.md",
        "dough/gyoza_wrapper.md",
        "dough/knedliky.md",
        "dough/liquid_roti.md",
        "dough/naan.md",
        "dough/pizza_dough.md",
        "dough/sourdough.md"
    ] },
    { "Drinks" = [
        "drinks/index.md",
        "drinks/cold_brew.md"
    ] },
    { "Preserves" = [
        "preserves/index.md",
        "preserves/kiwi_confiture.md"
    ] },
    { "Sauce" = [
        "sauce/index.md",
        "sauce/guacamole.md",
        "sauce/salsa_brava.md",
        "sauce/tzatziki.md"
    ] },
    { "Sides" = [
        "sides/index.md",
        "sides/empanada_gallega.md",
        "sides/frijoles_paste.md",
        "sides/migas.md",
        "sides/potato_au_gratin.md",
        "sides/quiche.md",
        "sides/saute_mushrooms.md"
    ] },
    { "Stew" = [
        "stew/index.md",
        "stew/goulash.md",
        "stew/gypsy_pot.md",
        "stew/lentejas.md"
    ] },
    { "Sweets" = [
        "sweets/index.md",
        "sweets/abuela_apple_cake.md",
        "sweets/abuela_cheesecake.md",
        "sweets/flan.md",
        "sweets/frozen_yoghurt.md",
        "sweets/ice_cream_jam.md",
        "sweets/tiramisu.md"
    ] }
]

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.def_list]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
options.custom_icons = ["overrides/.icons"]

[project.theme]
custom_dir = "overrides"
icon = { logo = "bootstrap/favicon" }
favicon = "favicon.svg"
language = "en"

features = [
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.expand",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "toc.follow",
    "toc.follow",
    "toc.integrate",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
